services:
  free_models:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: free_models_dev
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: file:/app/server/prisma/dev.db
    ports:
      - "${HOST_PORT:-8765}:3000"
    volumes:
      - db_data_dev:/app/server/prisma

volumes:
  db_data_dev:
